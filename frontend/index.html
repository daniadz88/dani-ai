<!DOCTYPE html>
<html lang="id">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
        <title>Dani AI — Security Terminal</title>

        <!-- PWA Manifest -->
        <link rel="manifest" href="/manifest.json" />

        <!-- Theme & Status Bar -->
        <meta name="theme-color" content="#0c0e12" />
        <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0c0e12" />
        <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f5f0" />

        <!-- iOS PWA Support -->
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
        <meta name="apple-mobile-web-app-title" content="Dani AI" />
        <link rel="apple-touch-icon" href="/favicon.svg" />

        <!-- Android / Chrome -->
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="application-name" content="Dani AI" />

        <!-- SEO & Share -->
        <meta name="description" content="Security research terminal by daniadz88" />
        <meta name="author" content="daniadz88" />
        <meta property="og:title" content="Dani AI — Security Terminal" />
        <meta property="og:description" content="AI-powered security research assistant" />
        <meta property="og:type" content="website" />

        <!-- Favicon -->
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>

        <!-- Register Service Worker -->
        <script>
            if ("serviceWorker" in navigator) {
                window.addEventListener("load", () => {
                    navigator.serviceWorker
                    .register("/sw.js")
                    .then((reg) => console.log("[PWA] SW registered:", reg.scope))
                    .catch((err) => console.log("[PWA] SW failed:", err));
                });
            }
        </script>
    </body>
</html>
